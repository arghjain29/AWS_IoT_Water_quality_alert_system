[project]
name = "water-station-simulator"
version = "0.1.0"
description = "Simulated water-quality stations publishing MQTT telemetry to AWS IoT Core"
requires-python = ">=3.11"
dependencies = [
    "awsiotsdk>=1.22",    # AWS IoT Device SDK v2 (MQTT over TLS)
    "python-dotenv>=1.0", # reads settings from .env
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false  # a plain script, not an installable package
